# Builds Opia for Android and publishes each build as a release (v0.2.<run>), so the newest APK is always at
# https://github.com/kanisakhpara-devs/Opia-for-Android/releases/latest/download/Opia.apk
name: Android

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the history since the last release becomes its notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # optional: a private signing key from the repository's secrets (see README.md)
      - name: Signing key
        env:
          KEY: ${{ secrets.OPIA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OPIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPIA_KEY_PASSWORD }}
        if: ${{ env.KEY != '' }}
        run: |
          echo "$KEY" | base64 -d > "$RUNNER_TEMP/opia.jks"
          {
            echo "OPIA_KEYSTORE=$RUNNER_TEMP/opia.jks"
            echo "OPIA_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "OPIA_KEY_ALIAS=$KEY_ALIAS"
            echo "OPIA_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        env:
          OPIA_VERSION_NAME: 0.2.${{ github.run_number }}
        run: |
          export OPIA_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))   # above the builds made in the Opia for Windows repository, so this installs over them
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Opia.apk"
          ls -la "$RUNNER_TEMP/Opia.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Opia-android-0.2.${{ github.run_number }}
          path: ${{ runner.temp }}/Opia.apk

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.2.${{ github.run_number }}
        run: |
          # the notes are what changed since the last release, one line per change: the app's update wizard shows them
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then notes=$(git log --no-merges --format='- %s' "$prev"..HEAD); else notes=$(git log -1 --format='- %s'); fi
          gh release create "v$VERSION" "$RUNNER_TEMP/Opia.apk" --target "$GITHUB_SHA" --latest \
            --title "Opia for Android $VERSION" --notes "$notes"
